<style>
/* ── HUBSPOT OVERRIDES — force full-width, remove default padding ── */
.dnd-section,.row-fluid,.dnd-column,.span12,.widget-span{padding:0!important;margin-left:0!important;margin-right:0!important;max-width:100%!important;width:100%!important}
.dnd-section>.dnd-column>.row-fluid{max-width:100%!important}
.content-wrapper,.body-container,.body-wrapper,#main-content{padding:0!important;max-width:100%!important;width:100%!important;margin:0 auto!important}
body .container-fluid,.container{padding:0!important;max-width:100%!important;width:100%!important}
.row-fluid [class*="span"]{margin-left:0!important}
/* Full-bleed sections break out of constrained parent */
.hero,.trust-bar{width:100vw!important;position:relative;left:50%;right:50%;margin-left:-50vw!important;margin-right:-50vw!important}
/* These sections need inner content centering via their own padding/max-width */
.claims-section,.why-section{max-width:1360px;margin-left:auto;margin-right:auto;padding-left:16px;padding-right:16px}
@media(min-width:768px){.claims-section,.why-section{padding-left:24px;padding-right:24px}}
@media(min-width:1280px){.claims-section,.why-section{padding-left:32px;padding-right:32px}}
/* HubSpot theme forces 'Open Sans' on the global nav/menu via !important.
   Override to MH brand fonts so the header matches the module. */
body,header,header *,
header .custom-menu-primary .hs-menu-wrapper ul li,
header .custom-menu-primary .hs-menu-wrapper ul li a,
.header-container,.header-container *,
.footer-container,.footer-container *{
  font-family:var(--font-sans)!important;
}

/* ── TOKENS — aligned to MH brand palette (branding-guideline.css) ── */
:root{
  --brand:#2257b8;--brand-dark:#002981;--brand-pale:#e7ebf6;--brand-light:#c2cbe9;
  --orange:#EF6C00;--orange-mid:#FB8C00;--orange-pale:#FFF3E0;--orange-dark:#E65100;
  --secondary:#FFAF26;--secondary-light:#FEF69D;--secondary-dark:#8D4501;
  --green:#4CAF50;--green-pale:#E8F5E9;--green-dark:#33691E;
  --gold:#FFAF26;
  --red:#F44336;--red-pale:#FFEBEE;--red-dark:#B71C1C;
  --ink:#212121;--ink-mid:#424242;--ink-muted:#757575;
  --border:#E0E0E0;--surface:#fafafa;--white:#FFFFFF;
  --shadow-sm:0 1px 4px rgba(34,87,184,.06);
  --shadow-md:0 4px 16px rgba(34,87,184,.09);
  --shadow-lg:0 12px 40px rgba(34,87,184,.13);
  --r-sm:8px;--r:12px;--r-lg:16px;
  --r-button:6px;
  /* mhg-design radius/button */
  /* Type:mhg-design tokens.css (Figma 82tOs1i8NmsLWxZkHTzB80), copied 2026-10-08.
     Chinese falls back to the device font, as on the live site. */
  --font-sans:'Albert Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --caption-size:12px;
  --body-2-size:14px;
  --body-1-size:16px;
  --title-1-size:18px;
  --display-1-size:20px;
  --display-2-size:24px;
  --display-3-size:28px;
  --display-5-size:34px;
  --highlight-orange-dark:#bf360c;
  --highlight-orange-light:#fff3e0;
  --highlight-green-dark:#33691e;
  --highlight-green-light:#e8f5e9;
}
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{word-break:break-word;overflow-wrap:break-word;overflow-x:clip}
body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:var(--body-1-size)}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer;border:none;background:none}img{max-width:100%;display:block}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand) 100%);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.hero-inner{max-width:1360px;margin:0 auto;padding:40px 20px 32px;position:relative;z-index:1}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:4px 14px;font-size:var(--caption-size);font-weight:700;color:rgba(255,255,255,.92);letter-spacing:0;margin-bottom:16px;backdrop-filter:blur(6px)}
.hero h1{font-size:clamp(var(--display-2-size),3.5vw,var(--display-5-size));font-weight:700;color:white;line-height:1.2;letter-spacing:0;margin-bottom:10px}
.hero h1 em{color:var(--secondary-light);font-style:normal}
.hero-desc{font-size:var(--body-2-size);color:rgba(255,255,255,.78);line-height:1.7;margin-bottom:24px;max-width:600px}
.hero-stats{display:flex;gap:0;flex-wrap:nowrap;justify-content:space-between}
.hero-stat-item{flex:1;min-width:0}
.hero-stat-val{font-size:clamp(16px,4.5vw,24px);font-weight:700;color:white;letter-spacing:0;display:block;white-space:nowrap}
.hero-stat-label{font-size:clamp(9px,2.2vw,11px);color:rgba(255,255,255,.6);margin-top:2px;white-space:nowrap}
@media(min-width:768px){.hero-inner{padding:48px 24px 36px}.hero-stats{gap:0}}

/* ── TRUST BAR ── */
.trust-bar{background:white;border-bottom:1px solid var(--border)}
.trust-inner{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:24px;overflow-x:auto;scrollbar-width:none}
.trust-inner::-webkit-scrollbar{display:none}
.trust-item{display:flex;align-items:center;gap:6px;font-size:var(--caption-size);font-weight:600;color:var(--ink-mid);white-space:nowrap;flex-shrink:0}

/* ── PROMO BANNER CAROUSEL ── */
.promo-carousel{position:relative;max-width:1360px;margin:16px auto 0;padding:0 16px;overflow:visible;z-index:10}
.promo-track-wrap{overflow:hidden;border-radius:var(--r-lg)}
@media(min-width:768px){.promo-carousel{padding:0 24px;margin:20px auto 0}}
@media(min-width:1280px){.promo-carousel{padding:0 32px}}
.promo-track{display:flex;transition:transform .4s ease-in-out;will-change:transform}
.promo-slide{flex:0 0 100%;min-width:0;display:block}
.promo-img{width:100%;height:auto;display:block;border-radius:var(--r-lg)}
/* Hide arrows + dots when only one banner (CSS fallback in case JS doesn't fire) */
.promo-carousel:has(.promo-track > .promo-slide:only-child) .promo-arrow,
.promo-carousel:has(.promo-track > .promo-slide:only-child) .promo-dots{display:none}
/* Arrows */
.promo-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);border:1px solid var(--border);color:var(--ink);font-size:var(--display-1-size);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);transition:all .15s;z-index:100;pointer-events:auto}
.promo-arrow:hover{background:var(--white);box-shadow:var(--shadow-md)}
.promo-arrow-left{left:20px}
.promo-arrow-right{right:20px}
@media(max-width:767px){.promo-arrow-left{left:8px}.promo-arrow-right{right:8px}.promo-arrow{width:28px;height:28px;font-size:var(--body-1-size)}}
.promo-dots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.promo-dot{width:8px;height:8px;border-radius:50%;background:var(--border);border:none;cursor:pointer;padding:0;transition:all .2s}
.promo-dot:hover{background:var(--brand-light)}
.promo-dot.active{background:var(--brand);width:20px;border-radius:4px}

/* ── LAYOUT ── */
.page{max-width:1360px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.page{padding:0 24px}}
@media(min-width:1280px){.page{padding:0 32px}}




/* ── SIDEBAR CARD ── */


.sidebar-divider{height:1px;background:var(--border);margin:14px 0}
.sidebar-group-title{font-size:var(--caption-size);font-weight:700;color:var(--ink-muted);margin-bottom:8px;letter-spacing:0}




/* ── QUOTE BAR (inside sidebar on desktop, standalone on mobile) ── */

/* Ensure sticky works inside HubSpot wrappers */
.body-wrapper,.body-container-wrapper,.body-container,.row-fluid-wrapper,.row-fluid,.dnd-section,.dnd-column,.hs_cos_wrapper,.widget-span,.dnd-module,.dnd-row{overflow:visible!important;transform:none!important;will-change:auto!important;contain:none!important;perspective:none!important}
/* Desktop hides the mobile sticky bar — desktop users get the sidebar Quote Bar instead (2026-06-08) */
/* Make the desktop sidebar sticky so the Quote Bar stays in view while scrolling the product list */










/* Primary row: tappable to expand, 2 columns */

/* Expanded section */


.qf-range-labels{display:flex;justify-content:space-between;font-size:var(--caption-size);color:var(--ink-muted);margin-top:2px}
/* Floating re-open pill */






.quote-bar-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}







/* Mobile coverage slider — span full width on 2-col grid */


/* Prevent range slider from blocking page scroll */




/* Sidebar quote uses stacked layout */



.qf-age-wrap{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--r-sm);overflow:hidden;height:38px;transition:border-color .15s}
.qf-age-wrap:focus-within{border-color:var(--brand)}
.qf-age-btn{width:34px;height:100%;display:flex;align-items:center;justify-content:center;font-size:var(--body-1-size);color:var(--ink-mid);background:var(--surface);transition:all .15s;flex-shrink:0}
.qf-age-btn:hover{background:var(--brand-pale);color:var(--brand)}
.qf-age-input{width:100%;border:none;text-align:center;font-size:var(--body-2-size);font-weight:700;color:var(--ink);outline:none;-moz-appearance:textfield;background:var(--white)}
.qf-age-input::-webkit-inner-spin-button,.qf-age-input::-webkit-outer-spin-button{-webkit-appearance:none}







/* Coverage slider (sidebar only) */
.qf-coverage-slider{margin-top:8px}
.qf-coverage-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.qf-coverage-val{flex:1;height:34px;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:0 8px;font-size:var(--body-2-size);font-weight:700;color:var(--ink);text-align:center;outline:none;-moz-appearance:textfield;background:var(--white)}
.qf-coverage-val:focus{border-color:var(--brand)}
.qf-coverage-val::-webkit-inner-spin-button,.qf-coverage-val::-webkit-outer-spin-button{-webkit-appearance:none}
.qf-coverage-unit{font-size:var(--caption-size);font-weight:600;color:var(--ink-muted)}

.qf-range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--brand);cursor:pointer;box-shadow:0 2px 6px rgba(34,87,184,.25);border:2px solid var(--white)}
.qf-range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--brand);cursor:pointer;border:2px solid var(--white)}
.qf-range-labels{display:flex;justify-content:space-between;font-size:var(--caption-size);color:var(--ink-muted);margin-top:2px}

/* Promo code copy button */
/* Legacy offer-code kept for tooltip positioning */
.offer-code-copied{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:white;font-size:var(--caption-size);font-weight:600;padding:3px 10px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10}
.offer-code-copied.show{opacity:1}
/* card-exclusive removed — replaced by promo-strip + promo-applied */

/* ── SECTION HEADER ── */
.sec-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:12px}
.sec-label{font-size:var(--caption-size);font-weight:700;letter-spacing:0;color:var(--brand);text-transform:uppercase;margin-bottom:4px}
.sec-title{font-size:clamp(18px,2.5vw,24px);font-weight:700;color:var(--ink);letter-spacing:0}
.sec-more{font-size:var(--caption-size);font-weight:700;color:var(--brand);white-space:nowrap;display:flex;align-items:center;gap:4px}
.sec-more:hover{text-decoration:underline}
@media(max-width:640px){.sec-header{flex-direction:column;align-items:flex-start}}

/* ── WHY SECTION (compact USP bar) ── */
.why-section{padding:0;margin:20px auto 0;position:relative;z-index:2}
.why-bar{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:20px 20px 16px;box-shadow:var(--shadow-md)}
.why-bar-title{font-size:var(--body-2-size);font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.why-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.why-grid{grid-template-columns:1fr 1fr;gap:12px}}
@media(min-width:1024px){.why-grid{grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}}
.usp-card{display:flex;gap:12px;align-items:flex-start}
.usp-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:var(--title-1-size);flex-shrink:0;background:var(--brand-pale);border:1px solid var(--brand-light)}
.usp-card h3{font-size:var(--body-2-size);font-weight:700;color:var(--ink);margin-bottom:2px}
.usp-card p{font-size:var(--caption-size);color:var(--ink-muted);line-height:1.5}

/* ── CATEGORY TABS (recommended/adult/children/elderly/family) ── */
.cat-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin:24px auto 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;max-width:1360px;padding-left:16px;padding-right:16px;touch-action:pan-x;-webkit-overflow-scrolling:touch}
@media(min-width:768px){.cat-tabs{padding-left:24px;padding-right:24px}}
@media(min-width:1280px){.cat-tabs{padding-left:32px;padding-right:32px}}
/* Product navigation dots */
.product-dots{display:flex;justify-content:center;gap:8px;padding:12px 0 4px;max-width:1360px;margin:0 auto}
@media(min-width:768px){.product-dots{padding:16px 0 8px}}
.product-dot{width:8px;height:8px;border-radius:50%;background:var(--border);border:none;cursor:pointer;padding:0;transition:all .2s}
.product-dot:hover{background:var(--brand-light)}
.product-dot.active{background:var(--brand);width:24px;border-radius:4px}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:10px 20px;font-size:var(--body-2-size);font-weight:700;color:var(--ink-muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;flex-shrink:0}
.cat-tab:hover{color:var(--brand)}
.cat-tab.active{color:var(--brand);border-bottom-color:var(--brand)}

/* ── SORT TABS ── */
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:16px 0 0}
.ftab{padding:7px 16px;border-radius:20px;font-size:var(--caption-size);font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--ink-mid);transition:all .15s;white-space:nowrap}
.ftab:hover{border-color:var(--brand);color:var(--brand)}
.ftab.active{background:var(--brand);color:white;border-color:var(--brand)}

/* ── RESULTS HEADER ── */




.results-help{display:none;font-size:var(--caption-size);font-weight:700;color:var(--brand)}

.results-filter-btn:hover{background:var(--brand-light);border-color:var(--brand)}


/* ── PRODUCT CARD ── */
.products-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}


.pcard:nth-child(1){animation-delay:.05s}.pcard:nth-child(2){animation-delay:.1s}.pcard:nth-child(3){animation-delay:.15s}.pcard:nth-child(4){animation-delay:.2s}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── TOP HIGHLIGHT RIBBON ── */

.insurer-avatar img{width:100%;height:100%;object-fit:contain;padding:4px}
.insurer-name{font-size:var(--body-2-size);font-weight:700;color:var(--ink)}



.pcard-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pcard-tag{padding:3px 10px;border-radius:20px;font-size:var(--caption-size);font-weight:700;line-height:1.4}
.pcard-tag.t-blue{background:var(--brand-pale);color:var(--brand)}
.pcard-tag.t-orange{background:var(--orange-pale);color:#BF360C}
.pcard-tag.t-green{background:var(--green-pale);color:var(--green-dark)}
/* ── USP CHIPS (rectangular, outlined, top of card) ── */




/* ── PRICE BANNER (FWD-inspired golden gradient) ── */

.price-banner::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='20' height='20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 3l2 4 4.5.7-3.2 3.2.8 4.5L10 13l-4.1 2.4.8-4.5L3.5 7.7 8 7z' fill='%23FFB300' opacity='.08'/%3E%3C/svg%3E") repeat;opacity:.5}

.price-currency{font-size:var(--body-2-size);font-weight:700;color:var(--ink)}

/* Expandable sections */

.social-proof strong{color:var(--orange);font-weight:700}

.pcard-cta-row{display:flex;align-items:center;gap:10px;padding:0 16px 14px;justify-content:flex-end;flex-wrap:wrap}
@media(min-width:768px){.pcard-cta-row{padding:0 20px 16px}}
.btn-apply-main{padding:10px 24px;font-size:var(--body-2-size);border-radius:var(--r);box-shadow:0 2px 8px rgba(239,108,0,.25)}

/* ── MOBILE FILTER SHEET (overlay) ── */


.filter-sheet{position:fixed;bottom:0;left:0;right:0;z-index:301;background:var(--white);border-radius:20px 20px 0 0;max-height:80vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);padding:0 0 env(safe-area-inset-bottom);box-shadow:0 -4px 24px rgba(0,0,0,.12)}













/* ── COVERAGE TABLE (expandable inside card) ── */

.coverage-table tr:nth-child(even){background:var(--surface)}


.coverage-table td:last-child{color:var(--brand);font-weight:700;text-align:right}

/* ── BUYER REVIEW (bottom of card) ── */
.card-review{border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;align-items:flex-start}

.review-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-pale);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:var(--body-2-size);flex-shrink:0}
.review-body{flex:1;min-width:0}

/* ── STICKY BUY CTA (product detail mode) ── */

/* ── STICKY BOTTOM CTA (scroll-triggered) ── */
.sticky-cta-bar{position:fixed;bottom:-100px;left:0;right:0;z-index:88;transition:bottom .4s ease-in-out;padding:0 16px 16px;pointer-events:none}

.sticky-cta-text{flex:1;min-width:0}

.sticky-cta-text .cta-main{font-size:var(--body-2-size);font-weight:700;color:white;line-height:1.3}
.sticky-cta-btn{padding:10px 22px;border-radius:var(--r);background:var(--orange);color:white;font-size:var(--body-2-size);font-weight:700;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(239,108,0,.35);transition:all .15s;white-space:nowrap;flex-shrink:0}
.sticky-cta-btn:hover{background:var(--orange-dark);transform:translateY(-1px)}
.sticky-cta-close{position:absolute;top:-8px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:var(--caption-size);color:var(--ink-muted);cursor:pointer;box-shadow:var(--shadow-sm);pointer-events:auto}

/* ── COMPARE BANNER ── */
.compare-banner{margin-top:32px;max-width:1360px;margin-left:auto;margin-right:auto;padding-left:16px;padding-right:16px}
@media(min-width:768px){.compare-banner{padding-left:24px;padding-right:24px}}
@media(min-width:1280px){.compare-banner{padding-left:32px;padding-right:32px}}
.compare-card{background:var(--brand);border-radius:var(--r-lg);padding:32px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;position:relative;overflow:hidden}
@media(min-width:768px){.compare-card{padding:36px 40px;gap:32px}}
.compare-card::before{content:'PK';position:absolute;right:40px;top:50%;transform:translateY(-50%);font-size:var(--display-5-size);font-weight:700;color:rgba(255,255,255,.05);letter-spacing:0;pointer-events:none}

.compare-title{font-size:var(--title-1-size);font-weight:700;color:white;margin-bottom:6px}
.compare-sub{font-size:var(--body-2-size);color:rgba(255,255,255,.7);line-height:1.6}
.compare-bullets{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.compare-bullet{display:flex;align-items:center;gap:6px;font-size:var(--caption-size);color:rgba(255,255,255,.85);font-weight:600}
.compare-bullet .check{color:var(--secondary-light)}
.compare-btn{padding:12px 28px;border-radius:var(--r);background:var(--orange);color:white;font-size:var(--body-2-size);font-weight:700;white-space:nowrap;box-shadow:0 4px 16px rgba(239,108,0,.35);z-index:1;transition:all .2s;flex-shrink:0}

@media(max-width:768px){.compare-card{grid-template-columns:1fr;text-align:center}.compare-btn{width:100%}.compare-card::before{display:none}}

/* ── CLAIMS ── */
.claims-section{padding-top:36px;margin-left:auto;margin-right:auto}
.claims-grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:768px){.claims-grid{grid-template-columns:1fr 1fr;gap:24px}}

.flow-card{background:white;border-radius:var(--r-lg);padding:24px;border:1.5px solid var(--border);box-shadow:var(--shadow-sm)}

.flow-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}

.fstep-circle{width:36px;height:36px;border-radius:50%;background:var(--brand);color:white;display:flex;align-items:center;justify-content:center;font-size:var(--body-1-size);z-index:1;flex-shrink:0;box-shadow:0 2px 8px rgba(34,87,184,.25)}
.fstep-name{font-size:var(--caption-size);font-weight:700;color:var(--ink);text-align:center}
.fstep-sub{font-size:var(--caption-size);color:var(--ink-muted);text-align:center;line-height:1.4}

.case-card{background:var(--brand-pale);border-radius:var(--r);padding:16px;border-left:3px solid var(--brand)}
.case-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.case-name{font-size:var(--body-2-size);font-weight:700}.case-meta{font-size:var(--caption-size);color:var(--ink-muted)}
.timeline{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;gap:8px;align-items:flex-start}
.tdot-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.tdot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.tline{width:2px;flex:1;background:var(--border);min-height:10px;margin:2px 0}
.tlabel{font-size:var(--caption-size);font-weight:700;border-radius:3px;padding:1px 6px;flex-shrink:0;white-space:nowrap}
.tcontent{font-size:var(--caption-size);color:var(--ink);line-height:1.6}

.features-card{background:white;border-radius:var(--r-lg);padding:24px;border:1.5px solid var(--border);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:14px}
.feat-item{display:flex;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.feat-item:last-child{border-bottom:none;padding-bottom:0}

.feat-title{font-size:var(--body-2-size);font-weight:700;color:var(--ink);margin-bottom:3px}
.feat-desc{font-size:var(--caption-size);color:var(--ink-muted);line-height:1.5}

/* ── FAQ ── */
.faq-section{padding-top:36px;padding-left:16px;padding-right:16px;max-width:1360px;margin:0 auto}
@media(min-width:768px){.faq-section{padding-left:24px;padding-right:24px}}
@media(min-width:1280px){.faq-section{padding-left:32px;padding-right:32px}}
.faq-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){.faq-grid{grid-template-columns:1fr 1fr;gap:14px}}
.faq-card{background:white;border-radius:var(--r);padding:18px;border:1.5px solid var(--border);box-shadow:var(--shadow-sm);cursor:pointer;transition:all .15s}
.faq-card:hover{border-color:var(--brand);box-shadow:var(--shadow-md)}
.faq-q{font-size:var(--body-2-size);font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.faq-num{width:22px;height:22px;border-radius:50%;background:var(--brand);color:white;font-size:var(--caption-size);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.faq-a{font-size:var(--caption-size);color:var(--ink-muted);line-height:1.65;padding-left:30px}

/* ── SEO CONTENT ── */
.seo-content{padding-top:40px;padding-left:16px;padding-right:16px;max-width:900px;margin:0 auto}
@media(min-width:768px){.seo-content{padding-left:24px;padding-right:24px}}
.seo-content h2{font-size:var(--display-1-size);font-weight:700;color:var(--ink);margin:32px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--brand);display:inline-block}
.seo-content h2:first-child{margin-top:0}
.seo-content h3{font-size:var(--body-1-size);font-weight:700;color:var(--brand-dark);margin:20px 0 8px}
.seo-content p{font-size:var(--body-2-size);color:var(--ink-mid);line-height:1.8;margin-bottom:12px}
.seo-content .seo-note{font-size:var(--caption-size);color:var(--ink-muted);line-height:1.6;margin-top:8px}
.seo-table-wrap{overflow-x:auto;margin:16px 0;border:1.5px solid var(--border);border-radius:var(--r)}
.seo-table{width:100%;border-collapse:collapse;font-size:var(--caption-size);min-width:700px}
.seo-table thead th{background:var(--brand);color:white;font-weight:700;padding:10px 12px;text-align:left;white-space:nowrap;position:sticky;top:0}
.seo-table thead th:first-child{background:var(--brand-dark);min-width:120px}
.seo-table tbody td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--ink);vertical-align:top}
.seo-table tbody td:first-child{font-weight:700;color:var(--ink);background:var(--surface);white-space:nowrap}
.seo-table tbody tr:nth-child(even){background:rgba(34,87,184,.02)}
.seo-table tbody tr:hover{background:var(--brand-pale)}

/* ── FOOTER CTA ── */
.footer-cta{margin:36px auto 48px;max-width:800px;background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand) 100%);border-radius:var(--r-lg);padding:32px 20px;text-align:center;position:relative;overflow:hidden}
@media(min-width:768px){.footer-cta{max-width:900px;padding:40px 48px}}
@media(min-width:1280px){.footer-cta{max-width:1000px}}
.footer-cta::before{content:'';position:absolute;left:-60px;bottom:-60px;width:180px;height:180px;background:rgba(255,255,255,.04);border-radius:50%}
.footer-cta-title{font-size:clamp(18px,2.5vw,28px);font-weight:700;color:white;letter-spacing:0;margin-bottom:10px}
.footer-cta-sub{font-size:var(--body-2-size);color:rgba(255,255,255,.7);margin-bottom:24px;line-height:1.6}
.footer-cta-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fcta-primary{padding:12px 28px;border-radius:var(--r);background:var(--orange);color:white;font-size:var(--body-2-size);font-weight:700;box-shadow:0 4px 16px rgba(239,108,0,.35);transition:all .2s}
.fcta-primary:hover{background:var(--orange-dark);transform:translateY(-2px)}
.fcta-ghost{padding:11px 24px;border-radius:var(--r);background:rgba(255,255,255,.12);color:white;border:1.5px solid rgba(255,255,255,.25);font-size:var(--body-2-size);font-weight:700;transition:all .2s}
.fcta-ghost:hover{background:rgba(255,255,255,.2)}

/* ── COMPARISON TRAY ── */

.compare-tray.visible{bottom:0}
.compare-tray-inner{max-width:1360px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.compare-tray-items{display:flex;gap:6px;align-items:center;flex:1;overflow-x:auto}
.compare-tray-item{display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--brand-pale);border-radius:6px;font-size:var(--caption-size);font-weight:600;color:var(--brand-dark);white-space:nowrap}
.compare-tray-remove{background:none;color:var(--ink-muted);font-size:var(--body-2-size);padding:0;cursor:pointer;border:none}
.btn-compare-now{padding:9px 18px;background:var(--brand);color:white;border-radius:var(--r-sm);font-size:var(--body-2-size);font-weight:700;white-space:nowrap;border:none;cursor:pointer;transition:background .15s}
.btn-compare-now:hover{background:var(--brand-dark)}

/* ── COMPARISON MODAL ── */
.compare-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;overflow-y:auto;padding:16px}
.compare-modal-overlay.open{display:flex;align-items:flex-start;justify-content:center}

.compare-modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.compare-modal-header h2{font-size:var(--title-1-size);font-weight:700;color:var(--ink)}
.compare-modal-close{background:none;font-size:var(--display-1-size);color:var(--ink-muted);cursor:pointer;border:none}

.compare-table{width:100%;border-collapse:collapse;font-size:var(--caption-size)}





.compare-table .cta-row td{text-align:center;border-bottom:none;padding:14px}


/* ── HubSpot native rich-text modules ──────────────────────────────────────────
   Rows added directly in the HubSpot editor (currently row 18: the 延伸閱讀 link
   list + the FB1740 disclaimer) sit outside every custom module, so nothing
   constrains their width and they render full-bleed against the viewport edge.
   Constrain them to the same 900px measure as .seo-content and mirror its prose
   styling so the two read as one continuous column. */
.dnd-module .widget-type-rich_text{max-width:900px;margin:0 auto;padding:0 16px;box-sizing:border-box}
@media(min-width:768px){.dnd-module .widget-type-rich_text{padding:0 24px}}
.dnd-module .widget-type-rich_text h2{font-size:var(--display-1-size);font-weight:700;color:var(--ink);margin:32px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--brand);display:inline-block}
/* The module currently opens with an empty <h2>&nbsp;</h2> placeholder. Collapse it, but only
   while a real heading follows it, so deleting that placeholder in HubSpot changes nothing. */
.dnd-module .widget-type-rich_text h2:first-child:has(+ h2){display:none}
.dnd-module .widget-type-rich_text p{font-size:var(--body-2-size);color:var(--ink-mid);line-height:1.8;margin-bottom:12px}
.dnd-module .widget-type-rich_text ul{margin:0 0 12px;padding-left:20px}
.dnd-module .widget-type-rich_text li{font-size:var(--body-2-size);color:var(--ink-mid);line-height:1.8;margin-bottom:6px}
.dnd-module .widget-type-rich_text a{color:var(--brand);text-decoration:underline;text-underline-offset:2px}
.dnd-module .widget-type-rich_text a:hover{color:var(--brand-dark)}
.dnd-module .widget-type-rich_text em{font-size:var(--caption-size);color:var(--ink-muted)}

/* ── PRODUCT CARD HIGHLIGHTS ── three key figures directly under the price banner.
   Same spec as the VHIS card's .key-facts: a stacked spec list, label left, value
   right, hairline dividers, no boxes and nothing that reads as a control. Sits
   INSIDE .pcard-body, so its side padding comes from the card - the rows must not
   carry their own or they stop aligning with the price banner above. */

.hl-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border)}
.hl-row:last-child{border-bottom:none}
.hl-k{display:flex;align-items:center;gap:5px;font-size:var(--caption-size);color:var(--ink-muted);font-weight:600;flex-shrink:0}
.hl-v{font-size:var(--body-2-size);font-weight:700;color:var(--ink);line-height:1.45;text-align:right;min-width:0}
