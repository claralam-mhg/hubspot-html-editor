/* Returns {original, discounted, monthly, discountPct} for current filter; snaps to nearest 5-yr bucket. */
function getPlanPrice(productId,age,gender,smoking){
  var plan=PREMIUM_RATES[productId];if(!plan)return null;
  var key=gender+'-'+smoking;
  var ages=[30,35,40,45,50],snap=ages[0];
  for(var i=0;i<ages.length;i++){if(Math.abs(ages[i]-age)<Math.abs(snap-age))snap=ages[i]}
  var entry=plan[snap]&&plan[snap][key];if(!entry)return null;if(entry==='NA')return{na:true};
  var orig=entry[0],disc=entry[1];
  var pct=orig>0?Math.round((1-disc/orig)*100):0;
  return{original:orig,discounted:disc,monthly:disc/12,discountPct:pct};
}
function fmtPrice(n){return Math.round(n).toLocaleString('en-US')}
function fmtMonthly(n){var v=Math.round(n*10)/10;return v.toLocaleString('en-US',{minimumFractionDigits:v%1?1:0,maximumFractionDigits:1})}

/* Build ContentStack item_id: HK.LFI.BRAND.PRODUCT-SLUG (UPPERCASE per A&A spec Apr 2026).
   Prefers explicit p.csId (hardcoded per product in product-data.html) so the value matches
   the actual ContentStack record. Falls back to auto-slugged English name. */
/* Bilingual array accessor. Falls back to the other language, then to an empty list, so a single
   untranslated field can never throw inside the product map and blank the entire list. This is a
   real case: fwd-premier has no moreInfo.en, which took every card off the EN page. */
/* Read one value out of a product's coverage table by its ZH label. Returns '-' when absent. */
function cov1(p,label){
  for(var i=0;i<(p.coverage||[]).length;i++){
    if(p.coverage[i].zh===label){var v=p.coverage[i].val;return typeof v==='object'?v[LANG]:v}
  }
  return '-';
}

function locList(o){var v=o&&(o[LANG]||o.zh||o.en);return Object.prototype.toString.call(v)==='[object Array]'?v:[]}

function csItemId(p){
  if(p&&p.csId)return p.csId;
  var brand=p.insurer.replace(/\s.*/,'').toUpperCase();
  var slug=p.name.en.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  return 'HK.LFI.'+brand+'.'+slug;
}

/* Build items array for a single product */
function buildItem(productId,index){
  var p=P.find(function(x){return x.id===productId});
  if(!p)return [];
  return [{item_id:csItemId(p),item_name:p.name[LANG],item_brand:p.insurer,index:typeof index==='number'?index:0}];
}

/* Build items array for multiple products (compare tray) */
function buildItems(ids){
  return ids.map(function(id,i){var p=P.find(function(x){return x.id===id});return p?{item_id:csItemId(p),item_name:p.name[LANG],item_brand:p.insurer,index:i}:null}).filter(Boolean);
}

/* ===== SOCIAL PROOF COUNTER =====
   Displayed figure = the GA4 baseline in SOCIAL_PROOF + this visitor's own apply-clicks today.

   The baseline is a REAL measurement — GA4 Sessions by productID over a 24-hour window (see the
   SOURCE note above SOCIAL_PROOF in product-data.html). It is therefore rendered as-is: no
   jitter, no rounding up, no synthetic floor. The badge states a fact to the user, so the number
   must be the measured one. Refreshing it is a data task, not a code one.

   Click counts are THIS BROWSER's clicks only and reset at local midnight.
   LIMITATION: localStorage cannot see other visitors, and the baseline is a static snapshot that
   goes stale. A live figure needs a backend endpoint aggregating the product_click_apply events
   already going to the dataLayer. */
var SOCIAL_PROOF_KEY='mh_li_social_proof';
function spDayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
/* Baseline — the measured GA4 figure, verbatim. 0 when a product has no entry, which hides the badge. */
function spBase(id){
  var w=(typeof SOCIAL_PROOF!=='undefined')&&SOCIAL_PROOF[id];
  return typeof w==='number'&&w>0?w:0;
}
/* This visitor's clicks for today. Stored shape: {d:'YYYY-M-D',c:{productId:Number}} */
function spClicks(){
  try{
    var raw=localStorage.getItem(SOCIAL_PROOF_KEY);
    if(raw){var o=JSON.parse(raw);if(o&&o.d===spDayKey()&&o.c)return o.c}
  }catch(e){}
  return {};
}
function spCount(id){return spBase(id)+(spClicks()[id]||0)}
function loadSocialProof(){
  /* Drop a store left from an earlier day so the count restarts at the new baseline. */
  try{
    var raw=localStorage.getItem(SOCIAL_PROOF_KEY);
    if(raw){var o=JSON.parse(raw);if(!o||o.d!==spDayKey())localStorage.removeItem(SOCIAL_PROOF_KEY)}
  }catch(e){}
}
/* Wrapped in try/catch so a failure here can never block the dlPush that runs after it in onclick handlers. */
function bumpSocialProof(id){
  try{
    if(!id)return;
    var c=spClicks();c[id]=(c[id]||0)+1;
    localStorage.setItem(SOCIAL_PROOF_KEY,JSON.stringify({d:spDayKey(),c:c}));
    var n=spBase(id)+c[id];
    document.querySelectorAll('.social-proof[data-pid="'+id+'"] .social-proof-num').forEach(function(el){el.textContent=n});
  }catch(e){}
}
function setSort(s,btn){state.sort=s;document.querySelectorAll('.ftab').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');trackEvent('filter_select_sort',{sort_by:s});renderProducts()}
function updateProviderFilter(){
  var checked=[];
  document.querySelectorAll('.sidebar-card .provider-filter-cb').forEach(function(cb){if(cb.checked)checked.push(cb.value)});
  var prev=state.providerFilter;
  var added=checked.filter(function(v){return prev.indexOf(v)<0});
  var removed=prev.filter(function(v){return checked.indexOf(v)<0});
  state.providerFilter=checked;
  added.forEach(function(v){dlPush({event:'filter_action',component_type:'sidebar',component_title:'Filter Attribute/Checkbox_Insurers',action:'check',filter_key:'Insurers',filter_value:v})});
  removed.forEach(function(v){dlPush({event:'filter_action',component_type:'sidebar',component_title:'Filter Attribute/Checkbox_Insurers',action:'uncheck',filter_key:'Insurers',filter_value:v})});
  renderProducts();
}

function toggleCompare(id,btn){
  var i=state.compared.indexOf(id);
  if(i>=0){state.compared.splice(i,1);if(btn)btn.classList.remove('active');dlPush({event:'product_compare',component_type:btn&&btn.closest('.compare-tray-item')?'bottom-sticky':'product-card',component_title:btn&&btn.closest('.compare-tray-item')?'Compare Tray/Button_Remove':'Product Card/Button_Compare',action:'click',intent:'Remove from Compare',item_list_name:'Life Insurance Comparison',items:buildItem(id,getProductIndex(id))})}
  else if(state.compared.length<3){state.compared.push(id);if(btn)btn.classList.add('active');dlPush({event:'product_compare',component_type:'product-card',component_title:'Product Card/Button_Compare',action:'click',intent:'Add to Compare',item_list_name:'Life Insurance Comparison',items:buildItem(id,getProductIndex(id))})}
  /* Hide product sticky CTA when compare is active */
  compareActive=state.compared.length>0;
  var bar=document.getElementById('stickyBuy');
  if(compareActive&&bar)bar.classList.remove('visible');
  renderCompareTray();
}
function renderCompareTray(){
  var tray=document.getElementById('compareTray'),items=document.getElementById('compareTrayItems');
  if(!state.compared.length){tray.classList.remove('visible');return}
  tray.classList.add('visible');
  items.innerHTML=state.compared.map(function(id){var p=P.find(function(x){return x.id===id});return '<div class="compare-tray-item"><span>'+p.name[LANG]+'</span><button class="compare-tray-remove" onclick="toggleCompare(\''+id+'\',this)">✕</button></div>'}).join('');
}
function openCompareModal(){
  if(state.compared.length<2)return;
  dlPush({event:'product_compare',component_type:'bottom-sticky',component_title:'Compare Tray/CTA_Compare',action:'click',intent:'Compare Now',item_list_name:'Life Insurance Comparison',items:buildItems(state.compared)});
  var products=state.compared.map(function(id){return P.find(function(x){return x.id===id})});
  /* Pull a value out of the product's own 保障計劃 coverage table by its ZH label, so the compare
     rows always match what the card shows. Accepts alternates because Zurich labels its term row
     保單年期 instead of 續保年期. Returns '—' when a product has no such row. */
  function cov(p,labels){
    for(var i=0;i<labels.length;i++){
      for(var j=0;j<p.coverage.length;j++){
        if(p.coverage[j].zh===labels[i]){
          var v=p.coverage[j].val;
          return typeof v==='object'?v[LANG]:v;
        }
      }
    }
    return '—';
  }
  var rows=[
    {l:t('annualPremium'),f:function(p){var pr=getPlanPrice(p.id,state.age,state.gender,state.smoking);if(pr&&pr.na)return 'NA';return 'HK'+p.yearlyPrice+'/'+(LANG==='zh'?'首年保費':'1st Year Premium')}},
    /* Sum insured is the quote basis — identical for every product, so it is a constant, not a per-product field. */
    {l:LANG==='zh'?'投保額':'Sum Insured',f:function(){return 'HK$3,000,000'}},
    {l:LANG==='zh'?'投保年齡':'Entry Age',f:function(p){return cov(p,['投保年齡'])}},
    {l:LANG==='zh'?'續保年期':'Renewal Term',f:function(p){return cov(p,['續保年期','保單年期'])}},
    {l:LANG==='zh'?'可續保年齡':'Renewable To',f:function(p){return cov(p,['可續保年齡'])}},
    {l:LANG==='zh'?'繳費模式':'Payment Mode',f:function(p){return cov(p,['繳費模式'])}},
    {l:LANG==='zh'?'免驗身':'No Medical Exam',f:function(p){return cov(p,['免驗身'])}},
    {l:LANG==='zh'?'末期疾病保障':'Terminal Illness Benefit',f:function(p){return cov(p,['末期疾病保障'])}},
    {l:LANG==='zh'?'意外身故額外賠償':'Accidental Death Benefit',f:function(p){return cov(p,['意外身故額外賠償'])}},
    {l:LANG==='zh'?'自殺條款':'Suicide Clause',f:function(p){return cov(p,['自殺條款'])}}
  ];
  var h='<thead><tr><th></th>'+products.map(function(p){return '<td class="product-col-header"><img src="'+p.logo+'" alt="'+p.insurer+'">'+p.name[LANG]+'</td>'}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr><th>'+r.l+'</th>';products.forEach(function(p){h+='<td>'+r.f(p)+'</td>'});h+='</tr>'});
  h+='<tr class="cta-row"><th></th>';products.forEach(function(p,pi){h+='<td><a href="'+p.url+'" target="_blank" rel="noopener" class="btn-apply" onclick="bumpSocialProof(\''+p.id+'\');dlPush({event:\'product_click_apply\',component_type:\'overlay\',component_title:\'Product Comparison Table/CTA_Apply Now\',action:\'click\',item_list_name:\'Life Insurance Comparison\',items:buildItem(\''+p.id+'\','+pi+'),reward_campaign_name:\'\',reward_campaign_id:\'\'})">'+t('applyNow')+' →</a></td>'});
  h+='</tr></tbody>';
  document.getElementById('compareTable').innerHTML=h;
  document.getElementById('compareModal').classList.add('open');
  document.body.style.overflow='hidden';
  /* Hide sticky bars to avoid clutter */
  var sc=document.getElementById('stickyCta');if(sc)sc.style.display='none';
  var sb=document.getElementById('stickyBuy');if(sb)sb.style.display='none';
  var ct=document.getElementById('compareTray');if(ct)ct.style.display='none';
}
function closeCompareModal(){
  document.getElementById('compareModal').classList.remove('open');
  document.body.style.overflow='';
  /* Restore sticky bars */
  var sc=document.getElementById('stickyCta');if(sc)sc.style.display='';
  var sb=document.getElementById('stickyBuy');if(sb)sb.style.display='';
  var ct=document.getElementById('compareTray');if(ct)ct.style.display='';
}

/* 篩選 — the VHIS filter (2026-10-14). Same component as the VHIS page.
   Mobile: the results bar (count, summary, 篩選) opens a draft sheet; nothing
   changes until 顯示 N 個計劃. 全部清除 clears insurers only, not the quote details.
   Desktop: the sidebar, sticky only when the whole panel fits the window.
   Commits go through the existing setters, so pricing, rendering and the
   filter_action events are unchanged. */
var FILTER_CFG={"fields": ["age", "gender", "smoking"], "count": "life"};
var vfTx={
  zh:{quote:'報價條件',prov:'保險公司',age:'投保年齡',gender:'性別',male:'男',female:'女',smoking:'吸煙狀態',ns:'非吸煙',s:'吸煙',
      term:'保障年期',t1:'1年',t10:'10年',show:'顯示 {n} 個計劃',none:'沒有符合的計劃',ageUnit:'歲',allProv:'所有保險公司',sep:'、'},
  en:{quote:'Quote details',prov:'Insurers',age:'Age',gender:'Gender',male:'Male',female:'Female',smoking:'Smoking',ns:'Non-smoker',s:'Smoker',
      term:'Term',t1:'1 year',t10:'10 years',show:'Show {n} plans',show1:'Show 1 plan',none:'No matching plans',ageUnit:'',allProv:'All insurers',sep:', '}
}[(typeof LANG!=='undefined'&&LANG==='en')?'en':'zh'];
var vfDraftState=null,vfSecOpen={quote:true,provider:true};
function vfHas(f){return FILTER_CFG.fields.indexOf(f)>=0}
function vfEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function vfProvs(){
  return [].map.call(document.querySelectorAll('.sidebar .provider-filter-cb'),function(cb){return {id:cb.value,name:cb.parentNode.textContent.trim()}});
}
function vfAges(){
  var sel=document.querySelector('.sidebar .qf-age-select');
  return sel?[].map.call(sel.options,function(o){return {v:o.value,t:o.textContent}}):[];
}
/* What 套用 would show, without committing. */
function vfCount(d){
  if(FILTER_CFG.count==='ci')return P.filter(function(p){
    if(getPlanPrice(p.id,d.age,d.gender,d.smoking,d.term).hide)return false;
    return !d.providers.length||d.providers.indexOf(p.providerId)>=0;
  }).length;
  if(FILTER_CFG.count==='life')return P.filter(function(p){return !d.providers.length||d.providers.indexOf(p.providerId)>=0}).length;
  var keep=state.providerFilter;state.providerFilter=d.providers;
  var n=getFiltered().length;state.providerFilter=keep;return n;
}
function vfSummary(){
  var parts=[],L=vfTx;
  if(vfHas('age'))parts.push(L.ageUnit?state.age+L.ageUnit:L.age+' '+state.age);
  if(vfHas('gender'))parts.push(state.gender==='male'?L.male:L.female);
  if(vfHas('smoking'))parts.push(state.smoking==='smoker'?L.s:L.ns);
  if(vfHas('term'))parts.push(state.term==='10y'?L.t10:L.t1);
  var ps=vfProvs().filter(function(p){return state.providerFilter.indexOf(p.id)>=0}).map(function(p){return p.name});
  parts.push(ps.length?ps.join(L.sep):L.allProv);
  return parts.join(' · ');
}
/* Called from renderProducts: the summary line and the insurer badge on 篩選. */
function syncFilterBar(){

function vfRenderSheet(){
  var d=vfDraftState,L=vfTx;if(!d)return;
  var q='';
  if(vfHas('age'))q+='<div class="fq-row"><label class="fq-label">'+L.age+'</label><select class="fsheet-select" onchange="vfDraft(\'age\',parseInt(this.value,10))">'+
    vfAges().map(function(a){return '<option value="'+a.v+'"'+(String(a.v)===String(d.age)?' selected':'')+'>'+vfEsc(a.t)+'</option>'}).join('')+'</select></div>';
  if(vfHas('gender'))q+='<div class="fq-row"><label class="fq-label">'+L.gender+'</label>'+vfSeg('gender',[['male','♂ '+L.male],['female','♀ '+L.female]])+'</div>';
  if(vfHas('smoking'))q+='<div class="fq-row"><label class="fq-label">'+L.smoking+'</label>'+vfSeg('smoking',[['non-smoker','🚭 '+L.ns],['smoker','🚬 '+L.s]])+'</div>';
  if(vfHas('term'))q+='<div class="fq-row"><label class="fq-label">'+L.term+'</label>'+vfSeg('term',[['1y',L.t1],['10y',L.t10]])+'</div>';
  var p=vfProvs().map(function(pr){
    return '<label class="fcheck"><input type="checkbox"'+(d.providers.indexOf(pr.id)>=0?' checked':'')+' onchange="vfProv(\''+pr.id+'\',this.checked)">'+vfEsc(pr.name)+'</label>';
  }).join('');
  document.getElementById('fsheetBody').innerHTML=(q?vfFsec('quote',L.quote,q):'')+vfFsec('provider',L.prov,p);
  /* The button says what you will get, and warns when nothing matches. */
  var n=vfCount(d),btn=document.getElementById('fsheetApply');
  btn.textContent=n?(n===1&&L.show1?L.show1:L.show.replace('{n}',n)):L.none;
  btn.disabled=!n;
}

function vfSec(id){vfSecOpen[id]=!vfSecOpen[id];vfRenderSheet()}
function vfProv(id,on){
  var a=vfDraftState.providers,i=a.indexOf(id);
  if(on&&i<0)a.push(id);if(!on&&i>=0)a.splice(i,1);
  vfRenderSheet();
}
function clearFilters(){
  dlPush({event:'filter_action',component_type:'filter-sheet',component_title:'Filter Attribute/CTA_ClearAll',action:'click',filter_key:'ClearAll',filter_value:'1'});
  vfDraftState.providers=[];vfRenderSheet();
}
function applyFilters(){
  var d=vfDraftState;if(!d)return;
  if(vfHas('age')&&d.age!==state.age)setAge(d.age,true);
  if(vfHas('gender')&&d.gender!==state.gender)setGender(d.gender);
  if(vfHas('smoking')&&d.smoking!==state.smoking)setSmoking(d.smoking);
  if(vfHas('term')&&d.term!==state.term)setTerm(d.term);
  if(d.providers.join()!==state.providerFilter.join()){
    document.querySelectorAll('.sidebar .provider-filter-cb').forEach(function(cb){cb.checked=d.providers.indexOf(cb.value)>=0});
    updateProviderFilter();
  }
  closeFilterSheet();
  syncFilterBar();
  /* Back to the top of the results, as on VHIS. */
  var main=document.querySelector('.main-content');
  if(main){var y=main.getBoundingClientRect().top+window.scrollY-8;if(window.scrollY>y)window.scrollTo({top:y,behavior:'smooth'})}
}

            '<span style="font-size:var(--caption-size);color:var(--ink-muted)"> /'+(LANG==='zh'?'年':'yr')+'</span>'+
          '</div>'+
          '<div class="price-monthly">'+
            '<span class="price-monthly-label">'+(LANG==='zh'?'即每月':'Monthly')+'</span>'+
            /* Inline override: .price-monthly-val is 18px/800 in styles.html, but this line should

            '<span class="price-monthly-val" style="font-size:var(--caption-size);font-weight:500">HK'+mp+'</span>'+
          '</div>'+
        '</div>')+
      /* ===== HIGHLIGHTS — three key figures, directly under the price =====
         投保額 is the shop-wide quote basis (HK$3,000,000 for every card); the other two read
         from this product's own coverage table so they can never drift apart. */
      '<div class="pcard-highlights">'+
        '<div class="hl-row"><span class="hl-k">'+(LANG==='zh'?'投保額':'Sum insured')+'</span><span class="hl-v">HK$'+parseInt(state.coverage,10).toLocaleString('en-US')+'</span></div>'+
        '<div class="hl-row"><span class="hl-k">'+(LANG==='zh'?'末期疾病保障':'Terminal Illness Benefit')+'</span><span class="hl-v">'+cov1(p,'末期疾病保障')+'</span></div>'+
        '<div class="hl-row"><span class="hl-k">'+(LANG==='zh'?'意外身故額外賠償':'Accidental Death Benefit')+'</span><span class="hl-v">'+cov1(p,'意外身故額外賠償')+'</span></div>'+
      '</div>'+
      '</div>'+
      /* Promo highlight strip with inline code */
      '<div class="promo-strip">'+
        '<span class="promo-strip-icon" aria-hidden="true">🎁</span>'+
        '<div class="promo-strip-body">'+
          '<span class="promo-strip-text">'+p.exclusive.text[LANG]+'</span>'+

          '<div class="promo-strip-footer">'+

            '<span class="promo-strip-expiry">'+p.exclusive.expiry[LANG]+'</span>'+

      (spCount(p.id)>0?'<div class="social-proof" data-pid="'+p.id+'"> '+(LANG==='zh'?'過去24小時內有<strong class="social-proof-num">'+spCount(p.id)+'</strong>人對此產品感興趣':'<strong class="social-proof-num">'+spCount(p.id)+'</strong> people viewed this product in the last 24 hours')+'</div>':'')+
      /* CTA row */
      '<div class="pcard-cta-row">'+
        '<button class="btn-compare'+(isC?' active':'')+'" onclick="toggleCompare(\''+p.id+'\',this)">'+t('compare')+'</button>'+
        '<a href="'+p.url+'" target="_blank" rel="noopener" class="btn-apply btn-apply-main" onclick="bumpSocialProof(\''+p.id+'\');dlPush({event:\'product_click_apply\',component_type:\'product-card\',component_title:\'Product Card/CTA_Apply Now\',action:\'click\',filter_applied:getFilterApplied(),item_list_name:\'Life Insurance Comparison\',items:buildItem(\''+p.id+'\',getProductIndex(\''+p.id+'\')),reward_campaign_name:\'\',reward_campaign_id:\'\'})">'+t('applyNow')+' →</a>'+

      '<div class="pcard-section"><button class="pcard-section-header" data-product-id="'+p.id+'" onclick="expandProduct(\''+p.id+'\')"><span class="pcard-section-title">'+secIcon('cov')+''+(LANG==='zh'?'關於計劃':'About the Plan')+'</span><span class="arrow">▼</span></button>'+
      '<div class="pcard-section-body"><table class="coverage-table">'+
        p.coverage.map(function(c){var covVal=function(v){return typeof v==='object'?v[LANG]:v};return '<tr><td>'+c[LANG]+'</td><td>'+String(covVal(c.val)).replace(/\n/g,'<br>')+'</td></tr>'}).join('')+

      '<div class="pcard-section"><button class="pcard-section-header" data-product-id="'+p.id+'" data-section="More Info" onclick="toggleSec(this)"><span class="pcard-section-title">'+secIcon('info')+''+(LANG==='zh'?'更多資訊':'More Info')+'</span><span class="arrow">▼</span></button><div class="pcard-section-body" onclick="collapseBodyClick(event,this)"><ul class="info-list">'+
        locList(p.moreInfo).map(function(m){return '<li>'+m+'</li>'}).join('')+
      '</ul></div></div>'+

      (p.docs&&(p.docs.brochure||provList.length)?

        provList.map(function(d){
          var lbl=d.label?d.label[LANG]:(LANG==='zh'?'保單條款 (PDF)':'Policy Provisions (PDF)');
          /* Keep the tracking title byte-identical for single-provision products so existing
             reports are unaffected; name the individual PDF only where there is more than one. */
          var ttl=(provList.length>1&&d.label&&d.label.en)?d.label.en:'Policy Provisions';
          return '<a href="'+d.url+'" target="_blank" rel="noopener" class="doc-link" onclick="dlPush({event:\'navigate\',component_type:\'product-card\',component_title:\'Product Card/Link_'+ttl+'\',action:\'click\',filter_applied:getFilterApplied(),item_list_name:\'Life Insurance Comparison\',items:buildItem(\''+p.id+'\',getProductIndex(\''+p.id+'\'))})">'+lbl+'</a>';
        }).join('')+

    '</div>';
  }).join('');
  /* If expanded product is no longer visible, clear it */
  if(state.expandedProduct&&!list.find(function(p){return p.id===state.expandedProduct})){
    state.expandedProduct=null;
  }
  updateStickyBuy();

}
/* Product navigation dots */
function renderProductDots(list){
  var dotsEl=document.getElementById('productDots');
  if(!dotsEl)return;
  dotsEl.innerHTML=list.map(function(p,i){
    return '<button class="product-dot'+(i===0?' active':'')+'" data-idx="'+i+'" data-id="'+p.id+'" onclick="scrollToProduct(\''+p.id+'\','+i+')" title="'+p.name[LANG]+'"></button>';
  }).join('');
}
function scrollToProduct(id,idx){
  var card=document.querySelector('.pcard[data-id="'+id+'"]');
  if(card)card.scrollIntoView({behavior:'smooth',block:'start'});
  /* Update active dot */
  document.querySelectorAll('.product-dot').forEach(function(d,i){d.classList.toggle('active',i===idx)});
}
/* Update dots on scroll */
function updateProductDots(){
  var cards=document.querySelectorAll('.pcard');
  var dots=document.querySelectorAll('.product-dot');
  if(!dots.length)return;
  var viewH=window.innerHeight;
  for(var i=0;i<cards.length;i++){
    var r=cards[i].getBoundingClientRect();
    if(r.top<viewH*0.5&&r.bottom>viewH*0.3){
      dots.forEach(function(d,j){d.classList.toggle('active',j===i)});
      break;
    }
  }
}
window.addEventListener('scroll',updateProductDots,{passive:true});

/* ===== PRODUCT EXPAND & STICKY BUY ===== */
function expandProduct(id){
  var card=document.querySelector('.pcard[data-id="'+id+'"]');
  if(!card)return;
  var header=card.querySelector('.pcard-section-header[data-product-id="'+id+'"]');
  var body=header?header.nextElementSibling:null;
  if(!header||!body)return;
  var wasOpen=body.classList.contains('open');
  if(wasOpen){
    header.classList.remove('open');
    body.classList.remove('open');
    dlPush({event:'product_interaction',component_type:'accordion',component_title:'Product Card_About the Plan',action:'collapse',filter_applied:getFilterApplied(),item_list_name:'Life Insurance Comparison',items:buildItem(id,getProductIndex(id)),reward_campaign_name:'',reward_campaign_id:'',search_result_parameter:''});
    state.expandedProduct=null;
  }else{
    /* close any other open coverage section first */
    var prev=document.querySelector('.pcard-section-header.open[data-product-id]');
    if(prev){prev.classList.remove('open');prev.nextElementSibling.classList.remove('open')}
    header.classList.add('open');
    body.classList.add('open');
    state.expandedProduct=id;
    dlPush({event:'product_interaction',component_type:'accordion',component_title:'Product Card_About the Plan',action:'expand',filter_applied:getFilterApplied(),item_list_name:'Life Insurance Comparison',items:buildItem(id,getProductIndex(id)),reward_campaign_name:'',reward_campaign_id:'',search_result_parameter:''});
  }
  updateStickyBuy();
}

function updateStickyBuy(){
  var bar=document.getElementById('stickyBuy');
  /* The compare tray owns the bottom of the screen while comparing. Without this guard,
     expanding a card section (or any re-render) re-shows the product bar on top of the tray. */
  if(compareActive){bar.classList.remove('visible');return}
  if(!state.expandedProduct){bar.classList.remove('visible');return}
  var p=P.find(function(x){return x.id===state.expandedProduct});
  if(!p){bar.classList.remove('visible');return}
  bar.classList.add('visible');
  document.getElementById('stickyBuyLogo').style.background='#fff';
  document.getElementById('stickyBuyLogo').innerHTML='<img src="'+p.logo+'" alt="'+p.insurer+'" style="width:100%;height:100%;object-fit:contain">';
  document.getElementById('stickyBuyName').textContent=p.name[LANG];
  var syp=p.yearlyPrice;
  document.getElementById('stickyBuyPrice').innerHTML='HK'+syp+'<span class="unit">/'+(LANG==='zh'?'首年保費':'1st Year Premium')+'</span>';
  var btn=document.getElementById('stickyBuyBtn');
  btn.href=p.url;
  btn.textContent=LANG==='zh'?'立即投保 →':'Apply Now →';
  btn.onclick=function(){bumpSocialProof(p.id);dlPush({event:'product_click_apply',component_type:'bottom-sticky',component_title:'Bottom Sticky/CTA_Apply Now',action:'click',filter_applied:getFilterApplied(),item_list_name:'Life Insurance Comparison',items:buildItem(p.id,getProductIndex(p.id)),reward_campaign_name:'',reward_campaign_id:''})};
  if(typeof checkStickyCta==='function')checkStickyCta();
}
function toggleSec(btn){var b=btn.nextElementSibling;b.classList.toggle('open');btn.classList.toggle('open');var pid=btn.getAttribute('data-product-id');var sec=btn.getAttribute('data-section');if(pid&&sec){var act=b.classList.contains('open')?'expand':'collapse';dlPush({event:'product_interaction',component_type:'accordion',component_title:'Product Card_'+sec,action:act,filter_applied:getFilterApplied(),item_list_name:'Life Insurance Comparison',items:buildItem(pid,getProductIndex(pid)),reward_campaign_name:'',reward_campaign_id:'',search_result_parameter:''})}}

/* Close a pcard section by clicking anywhere inside its open body.
   Ignores clicks that land on interactive elements (buttons, links, inputs). */
function collapseBodyClick(event,bodyEl){
  var el=event.target;
  while(el&&el!==bodyEl){
    var tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
    el=el.parentElement;
  }
  var header=bodyEl.previousElementSibling;
  var pid=header&&header.getAttribute('data-product-id');
  if(pid){expandProduct(pid)}else{toggleSec(header)}
}

/* ===== STICKY CTA (scroll-triggered) =====
   The bottom "免費比較" bar was removed from the markup Aug 2026. Every reference below is
   null-guarded so the page runs identically whether or not #stickyCta exists — without the
   guards, a missing element throws here at top level and nothing after it (including
   initPage) ever runs, leaving a blank page. */
var stickyCtaDismissed=false;
var stickyCtaEl=document.getElementById('stickyCta');
if(stickyCtaEl)stickyCtaEl.style.position='fixed';

function checkStickyCta(){
  if(!stickyCtaEl)return;
  if(stickyCtaDismissed){stickyCtaEl.classList.remove('visible');return}
  var scrolled=window.scrollY||document.documentElement.scrollTop;
  var productBuyVisible=document.getElementById('stickyBuy').classList.contains('visible');
  if(scrolled>400&&!productBuyVisible){stickyCtaEl.classList.add('visible')}
  else{stickyCtaEl.classList.remove('visible')}
}
function dismissStickyCta(){stickyCtaDismissed=true;if(stickyCtaEl)stickyCtaEl.classList.remove('visible');trackEvent('navigate_click_dismiss-cta',{})}
window.addEventListener('scroll',checkStickyCta,{passive:true});

/* ===== STICKY PRODUCT CTA ON SCROLL (mobile + desktop) ===== */
var scrollProductCta=null;
var compareActive=false;
function checkProductInView(){
  if(state.expandedProduct||compareActive)return;
  var cards=document.querySelectorAll('.pcard');
  var found=null;
  var viewH=window.innerHeight;
  for(var i=0;i<cards.length;i++){
    var r=cards[i].getBoundingClientRect();
    if(r.top<viewH*0.6&&r.bottom>viewH*0.3){
      found=cards[i].getAttribute('data-id');
      break;
    }
  }
  var bar=document.getElementById('stickyBuy');
  if(found&&found!==scrollProductCta){
    scrollProductCta=found;
    var p=P.find(function(x){return x.id===found});
    if(!p)return;
    bar.classList.add('visible');
    document.getElementById('stickyBuyLogo').innerHTML='<img src="'+p.logo+'" alt="'+p.insurer+'" style="width:100%;height:100%;object-fit:contain;padding:3px">';
    document.getElementById('stickyBuyName').textContent=p.name[LANG];
    var syp=p.yearlyPrice;
    document.getElementById('stickyBuyPrice').innerHTML='HK'+syp+'<span class="unit">/'+(LANG==='zh'?'首年保費':'1st Year Premium')+'</span>';
    var btn=document.getElementById('stickyBuyBtn');
    btn.href=p.url;
    btn.textContent=t('applyNow')+' →';
    btn.onclick=function(){bumpSocialProof(p.id);dlPush({event:'product_click_apply',component_type:'bottom-sticky',component_title:'Bottom Sticky/CTA_Apply Now',action:'click',filter_applied:getFilterApplied(),item_list_name:'Life Insurance Comparison',items:buildItem(p.id,getProductIndex(p.id)),reward_campaign_name:'',reward_campaign_id:''})};
  }else if(!found){
    scrollProductCta=null;
    if(!state.expandedProduct)bar.classList.remove('visible');
  }
}
window.addEventListener('scroll',checkProductInView,{passive:true});

/* ===== PROMO BANNER CAROUSEL ===== */
(function(){
  var track=document.getElementById('promoTrack');
  var dotsWrap=document.getElementById('promoDots');
  if(!track||!dotsWrap)return;
  var slides=track.querySelectorAll('.promo-slide');
  var total=slides.length;
  if(total<1)return;
  /* Hide arrows + dots when only one banner */
  if(total<=1){
    var pc=document.getElementById('promoCarousel');
    if(pc){
      var lArr=pc.querySelector('.promo-arrow-left');if(lArr)lArr.style.display='none';
      var rArr=pc.querySelector('.promo-arrow-right');if(rArr)rArr.style.display='none';
    }
    dotsWrap.style.display='none';
  }
  var current=0;
  var autoTimer=null;
  for(var i=0;i<total;i++){
    var d=document.createElement('button');
    d.className='promo-dot'+(i===0?' active':'');
    d.onclick=(function(idx){return function(){goTo(idx)}})(i);
    dotsWrap.appendChild(d);
  }
  function goTo(idx){
    current=((idx%total)+total)%total;
    track.style.transform='translateX(-'+current*100+'%)';
    dotsWrap.querySelectorAll('.promo-dot').forEach(function(d,i){d.classList.toggle('active',i===current)});
    resetAuto();
  }
  window.promoSlide=function(dir){goTo(current+dir)};
  function resetAuto(){clearInterval(autoTimer);autoTimer=setInterval(function(){goTo(current+1)},5000)}
  resetAuto();
  var carousel=document.getElementById('promoCarousel');
  /* #2207 - Image Carousel click tracking */
  carousel.addEventListener('click',function(e){
    var slide=e.target.closest('.promo-slide');if(!slide)return;
    var img=slide.querySelector('img');
    var alt=img?img.getAttribute('alt')||'':'';
    var title=slide.getAttribute('data-title')||carousel.getAttribute('aria-label')||'Promo Banner';
    dlPush({event:'navigate',component_type:'image-carousel',component_title:title+'_'+alt,action:'click',index:String(current)});
  });
  carousel.addEventListener('mouseenter',function(){clearInterval(autoTimer)});
  carousel.addEventListener('mouseleave',resetAuto);
  var startX=0,moved=false;
  track.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;moved=false},{passive:true});
  track.addEventListener('touchmove',function(e){if(Math.abs(e.touches[0].clientX-startX)>30)moved=true},{passive:true});
  track.addEventListener('touchend',function(e){
    if(!moved)return;
    var diff=e.changedTouches[0].clientX-startX;
    if(diff>40)promoSlide(-1);
    else if(diff<-40)promoSlide(1);
  });
})();

/* ===== SCROLL DEPTH TRACKING ===== */
(function(){
  var milestones={25:false,50:false,75:false,100:false};
  function getScrollPct(){
    var scrollTop=window.scrollY||document.documentElement.scrollTop;
    var docHeight=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)-window.innerHeight;
    if(docHeight<=0)return 100;
    return Math.round(scrollTop/docHeight*100);
  }
  window.addEventListener('scroll',function(){
    var pct=getScrollPct();
    [25,50,75,100].forEach(function(m){
      if(!milestones[m]&&pct>=m){
        milestones[m]=true;
        trackEvent('scroll_vertical_pc_'+m,{});
      }
    });
  },{passive:true});
})();

/* ===== PRODUCT CARD IMPRESSION TRACKING ===== */
(function(){
  if(!('IntersectionObserver' in window))return;
  var impressed={};
  var observer=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(!entry.isIntersecting)return;
      var card=entry.target;
      var id=card.getAttribute('data-id');
      if(!id||impressed[id])return;
      impressed[id]=true;
      trackEvent('product_interact_impression',{product_id:id});
      observer.unobserve(card);
    });
  },{threshold:0.5});
  /* Observe cards after render — re-run on each renderProducts call */
  var origRender=window.renderProducts;
  if(typeof origRender==='function'){
    window.renderProducts=function(){
      origRender.apply(this,arguments);
      impressed={};
      document.querySelectorAll('.pcard[data-id]').forEach(function(card){
        observer.observe(card);
      });
    };
  }
  /* Also observe any cards already in DOM */
  document.querySelectorAll('.pcard[data-id]').forEach(function(card){
    observer.observe(card);
  });
})();

/* ===== INIT ===== */
function initPage(){
  if(typeof P==='undefined'){setTimeout(initPage,50);return}
  document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(T[LANG][k])el.textContent=T[LANG][k]});
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){var k=el.getAttribute('data-i18n-html');if(T[LANG][k])el.innerHTML=T[LANG][k]});
  var ht=document.getElementById('heroTitle');if(ht)ht.innerHTML=T[LANG].heroTitle;
  var hd=document.getElementById('heroDesc');if(hd)hd.innerHTML=T[LANG].heroDesc;
  loadSocialProof();
  populateAgeSelect();
  renderProducts();renderFAQ();
}
initPage();
