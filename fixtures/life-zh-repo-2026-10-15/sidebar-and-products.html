<!-- Component: Quote Bar + Sidebar + Product List — Quote Bar merged at top per 2026-06-08 simplification (one HubSpot module instead of two) -->


<!-- === SIDEBAR + MAIN LAYOUT === -->
<div class="page-layout">

  <!-- LEFT SIDEBAR (desktop only — visibility controlled by .sidebar{display:none} + @media≥1024px) -->
  <aside class="sidebar">
    <!-- Quote Bar — desktop variant, sits above Provider Filter. Shares state with mobile bar via class selectors in setAge/setGender/setSmoking. -->
    <div class="sidebar-card">
      <div class="sidebar-card-title"><span data-i18n="quoteTitle">輸入資料即時比較報價</span></div>
      <div class="quote-bar-grid">
        <div class="qf-field">
          <label><span data-i18n="age">年齡</span></label>
          <select class="qf-select qf-age-select" onchange="setAge(this.value,true)"></select>
        </div>
        <div class="qf-field">
          <label><span data-i18n="gender">性別</span></label>
          <div class="qf-toggle">
            <button class="qf-toggle-btn active" data-value="male" onclick="setGender('male')">♂ <span data-i18n="male">男</span></button>
            <button class="qf-toggle-btn" data-value="female" onclick="setGender('female')">♀ <span data-i18n="female">女</span></button>
          </div>
        </div>
        <div class="qf-field">
          <label><span data-i18n="smoking">吸煙狀態</span></label>
          <div class="qf-toggle">
            <button class="qf-toggle-btn active" data-value="non-smoker" onclick="setSmoking('non-smoker')">🚭 <span data-i18n="nonSmoker">非吸煙</span></button>
            <button class="qf-toggle-btn" data-value="smoker" onclick="setSmoking('smoker')">🚬 <span data-i18n="smokerLabel">吸煙</span></button>
          </div>
        </div>
      </div>
    </div>
    <!-- Provider Filter -->
    <div class="sidebar-card">
      <div class="sidebar-card-title"><span data-i18n="filterProviders">保險公司</span></div>
      <label class="sidebar-checkbox"><input type="checkbox" class="provider-filter-cb" value="bowtie" onchange="updateProviderFilter()">Bowtie</label>
      <label class="sidebar-checkbox"><input type="checkbox" class="provider-filter-cb" value="fwd" onchange="updateProviderFilter()">FWD 富衛</label>
      <label class="sidebar-checkbox"><input type="checkbox" class="provider-filter-cb" value="blue" onchange="updateProviderFilter()">Blue</label>
      <label class="sidebar-checkbox"><input type="checkbox" class="provider-filter-cb" value="zurich" onchange="updateProviderFilter()">Zurich 蘇黎世</label>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <!-- Sort tabs -->

    <!-- Results -->

    <div class="pricing-basis" id="pricingBasis"></div>
    <div class="products-grid" id="productList"></div>
  </div>
</div><!-- /page-layout -->
